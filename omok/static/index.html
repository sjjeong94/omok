<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omok</title>
<style>
  :root {
    --bg: #1d1f21;
    --panel: #282a2e;
    --text: #e6e6e6;
    --muted: #9a9ea5;
    --accent: #3ddc84;
    --wood: #dcb35c;
    --line: #5a4420;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  main {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  canvas {
    width: min(92vw, 80vh, 760px);
    aspect-ratio: 1;
    border-radius: 6px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
    cursor: pointer;
    touch-action: manipulation;
  }
  aside {
    width: 240px;
    background: var(--panel);
    border-radius: 8px;
    padding: 20px;
  }
  h1 { margin: 0 0 16px; font-size: 22px; letter-spacing: .08em; }
  .status { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin-bottom: 16px; }
  .status dt { color: var(--muted); }
  .status dd { margin: 0; font-variant-numeric: tabular-nums; }
  .stone { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
  .stone.b { background: #111; border: 1px solid #555; }
  .stone.w { background: #f4f4f4; }
  #message { min-height: 1.4em; color: var(--accent); font-weight: 600; margin-bottom: 12px; }
  button {
    display: flex;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 8px;
    padding: 9px 12px;
    background: #373b41;
    color: var(--text);
    border: 0;
    border-radius: 6px;
    font: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #43474e; }
  button:disabled { opacity: .4; cursor: default; }
  kbd { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  label { display: flex; gap: 8px; align-items: center; margin: 14px 0 0; color: var(--muted); cursor: pointer; }
  footer { margin-top: 16px; color: var(--muted); font-size: 12px; }
  select {
    width: 100%;
    margin-top: 10px;
    padding: 7px 8px;
    background: #373b41;
    color: var(--text);
    border: 0;
    border-radius: 6px;
    font: inherit;
  }
  .note { margin-top: 6px; color: var(--muted); font-size: 12px; }
  .replay { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
  .replay button { width: 34px; margin: 0; padding: 5px 0; justify-content: center; }
  .replay input { flex: 1; min-width: 0; accent-color: var(--accent); }
  .chart-head { display: flex; justify-content: space-between; align-items: center; margin-top: 10px;
                font-size: 12px; color: var(--muted); }
  .seg { display: flex; gap: 2px; }
  .seg button { width: auto; margin: 0; padding: 2px 8px; font-size: 12px; color: var(--muted); }
  .seg button.on { background: #4a4f57; color: var(--text); }
  #chart { display: block; width: 100%; height: 100px; margin-top: 4px; cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; }
  .eval { display: flex; justify-content: space-between; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .bar { height: 8px; margin: 6px 0 10px; border-radius: 4px; background: #f4f4f4; overflow: hidden; }
  .bar > div { height: 100%; background: #111; border-right: 1px solid #555; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 500; }
  th, td { padding: 3px 4px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  tbody tr:hover, tbody tr.focus { background: #373b41; }
</style>
</head>
<body>
<main>
  <canvas id="board" width="760" height="760"></canvas>
  <aside>
    <h1 id="title">OMOK</h1>
    <dl class="status">
      <dt>Turn</dt><dd id="player"></dd>
      <dt>Moves</dt><dd id="moves"></dd>
      <dt>Rule</dt><dd id="rule"></dd>
    </dl>
    <div id="message"></div>
    <button data-action="agent" id="agent-btn">AI move <kbd>A</kbd></button>
    <button data-action="back">Move back <kbd>B</kbd></button>
    <button data-action="reset">Reset <kbd>Space</kbd></button>
    <button data-action="save">Save log <kbd>S</kbd></button>
    <label><input type="checkbox" id="auto"> AI replies automatically</label>
    <label><input type="checkbox" id="numbers" checked> Show move numbers</label>
    <label><input type="checkbox" id="marks" checked> Show forbidden moves</label>
    <label><input type="checkbox" id="analysis"> Show AI analysis <kbd>P</kbd></label>
    <div id="analysis-panel" hidden>
      <select id="layer">
        <option value="visits">Visits (search)</option>
        <option value="prior">Prior (network)</option>
        <option value="q">Win rate × visits</option>
        <option value="diff">Search − network</option>
      </select>
      <label><input type="checkbox" id="pv" checked> Show best line</label>
      <label><input type="checkbox" id="live" checked> Watch the search live</label>
      <label><input type="checkbox" id="paths"> Show search paths</label>
      <div class="eval"><span id="eval-black"></span><span id="eval-white"></span></div>
      <div class="bar"><div id="eval-bar"></div></div>
      <table>
        <thead><tr><th>Move</th><th id="lines-share">Visits</th><th>Win</th><th>Prior</th></tr></thead>
        <tbody id="lines"></tbody>
      </table>
      <div class="note" id="eval-sims"></div>
      <div id="replay" hidden>
        <div class="replay">
          <button id="play" title="Replay the search">▶</button>
          <input type="range" id="frame" min="0" max="0" value="0" title="Search progress">
        </div>
        <div class="chart-head">
          <span>Top moves</span>
          <span class="seg"><button data-chart="visits" class="on">Visits</button><button data-chart="win">Win</button></span>
        </div>
        <canvas id="chart" width="400" height="200"></canvas>
        <div class="legend" id="legend"></div>
      </div>
    </div>
    <footer id="version"></footer>
  </aside>
</main>
<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const W = canvas.width;
let SIZE = 15;
let CELL = W / SIZE;
const autoBox = document.getElementById('auto');
const numbersBox = document.getElementById('numbers');
const marksBox = document.getElementById('marks');
const analysisBox = document.getElementById('analysis');
const layerSelect = document.getElementById('layer');
const pvBox = document.getElementById('pv');
const liveBox = document.getElementById('live');
const pathsBox = document.getElementById('paths');
const frameSlider = document.getElementById('frame');
const playBtn = document.getElementById('play');
const chart = document.getElementById('chart');
let game = null;
let hover = -1;
let focus = -1;  // the candidate move hovered in the analysis table
let busy = false;

// The live search: its frames (one analysis per batch of simulations) and the one shown.
let frames = [];
let shown = -1;
let searchTotal = 0;
let searchDone = false;
let watchToken = 0;
let watching = null;  // resolves to whether the watched search finished
let thinking = false;  // waiting for the watched search before the AI moves
let playTimer = null;
let chartMode = 'visits';

async function api(action, body) {
  const res = await fetch('/api/' + action, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({analysis: analysisBox.checked && !liveMode(), ...body}),
  });
  return res.json();
}

async function send(action, body) {
  if (busy) return;
  busy = true;
  try {
    const data = await api(action, body);
    if (action === 'save') {
      document.getElementById('message').textContent = 'Saved ' + data.file;
      return;
    }
    game = data;
    if (game.size !== SIZE) {
      SIZE = game.size;
      CELL = W / SIZE;
      hover = -1;
    }
    render();
    startWatch();
  } finally {
    busy = false;
  }
}

function liveMode() {
  return analysisBox.checked && liveBox.checked && !!game && !!game.watch;
}

// Follow the server's search of the current position, showing each new frame.
function startWatch() {
  stopPlay();
  const token = ++watchToken;
  frames = [];
  shown = -1;
  searchDone = false;
  watching = liveMode() && !game.done ? watch(token) : null;
}

async function watch(token) {
  const moves = game.moves.length;
  for (;;) {
    let r;
    try {
      r = await api('search', {since: frames.length});
    } catch {
      return false;
    }
    if (token !== watchToken || !r || r.moves !== moves) return false;
    searchTotal = r.total;
    searchDone = r.done;
    frames.push(...r.frames);
    if (r.frames.length || r.done) showFrame(frames.length - 1);
    if (r.done) return true;
    await new Promise(resolve => setTimeout(resolve, 50));
  }
}

function showFrame(i) {
  shown = i;
  game.analysis = frames[i];
  render();
}

function stopPlay() {
  clearInterval(playTimer);
  playTimer = null;
  playBtn.textContent = '▶';
}

function play() {
  if (playTimer) return stopPlay();
  if (!frames.length) return;
  let i = shown >= frames.length - 1 ? 0 : shown;
  showFrame(i);
  playBtn.textContent = '❚❚';
  playTimer = setInterval(() => {
    if (++i >= frames.length) return stopPlay();
    showFrame(i);
  }, Math.max(30, Math.min(150, 3000 / frames.length)));
}

// After the watched search (if any), so the AI plays the search that was shown.
async function aiMove() {
  if (thinking || !game || !game.agent || game.done) return;
  if (watching) {
    thinking = true;
    render();
    const finished = await watching;
    thinking = false;
    if (!finished) return render();
  }
  await send('agent');
}

const center = i => CELL / 2 + i * CELL;

function drawBoard() {
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--wood');
  ctx.fillRect(0, 0, W, W);
  ctx.strokeStyle = '#5a4420';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < SIZE; i++) {
    ctx.moveTo(center(0), center(i)); ctx.lineTo(center(SIZE - 1), center(i));
    ctx.moveTo(center(i), center(0)); ctx.lineTo(center(i), center(SIZE - 1));
  }
  ctx.stroke();
  ctx.fillStyle = '#5a4420';
  const e = SIZE - 4, c = (SIZE - 1) / 2;
  const stars = SIZE === 19
    ? [3, c, e].flatMap(x => [3, c, e].map(y => [x, y]))
    : [[3, 3], [e, 3], [c, c], [3, e], [e, e]];
  for (const [x, y] of stars) {
    ctx.beginPath();
    ctx.arc(center(x), center(y), 5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawStone(x, y, player, alpha = 1) {
  const cx = center(x), cy = center(y), r = CELL * 0.45;
  const g = ctx.createRadialGradient(cx - r / 3, cy - r / 3, r / 8, cx, cy, r);
  if (player === 1) { g.addColorStop(0, '#666'); g.addColorStop(1, '#0a0a0a'); }
  else { g.addColorStop(0, '#fff'); g.addColorStop(1, '#cfcfcf'); }
  ctx.globalAlpha = alpha;
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawForbidden(x, y) {
  const cx = center(x), cy = center(y), r = CELL * 0.18;
  ctx.strokeStyle = '#e53935';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r);
  ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r);
  ctx.stroke();
}

function circle(pos, r) {
  ctx.beginPath();
  ctx.arc(center(pos % SIZE), center(Math.floor(pos / SIZE)), r, 0, Math.PI * 2);
}

function label(pos, text, color) {
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `600 ${Math.round(CELL * 0.3)}px system-ui, sans-serif`;
  ctx.fillText(text, center(pos % SIZE), center(Math.floor(pos / SIZE)) + 1);
}

// Win rate of the searched moves: circle size by visit share, color from red (losing) to green (winning).
function drawWinRates(a, skip) {
  const max = Math.max(...a.visits);
  a.q.forEach((q, pos) => {
    if (q === null || skip.has(pos)) return;
    const t = a.visits[pos] / max;
    const hue = 60 + 120 * Math.max(-0.5, Math.min(0.5, q));  // red (losing) .. green (winning), full at ±0.5
    ctx.fillStyle = `hsla(${hue}, 75%, 42%, ${0.45 + 0.5 * t})`;
    circle(pos, CELL * (0.2 + 0.25 * Math.sqrt(t)));
    ctx.fill();
    if (t >= 0.05) label(pos, Math.round((q + 1) * 50), '#fff');
  });
}

// Where the search disagrees with the network: green where it raised a move, red where it lowered one.
function drawDiff(a, skip) {
  const diff = a.visits.map((v, pos) => v - a.prior[pos]);
  const max = Math.max(...diff.map(Math.abs));
  if (!(max > 0)) return;
  diff.forEach((d, pos) => {
    if (Math.abs(d) < 0.005 || skip.has(pos)) return;
    const t = Math.abs(d) / max;
    ctx.fillStyle = d > 0 ? `rgba(46, 160, 67, ${0.3 + 0.6 * t})` : `rgba(229, 57, 53, ${0.3 + 0.6 * t})`;
    circle(pos, CELL * (0.18 + 0.25 * Math.sqrt(t)));
    ctx.fill();
    if (Math.abs(d) >= 0.01) label(pos, (d > 0 ? '+' : '−') + Math.round(Math.abs(d) * 100), '#fff');
  });
}

// A principal variation as translucent stones numbered on from the game, starting with the player to move.
function drawLine(pv, player, start) {
  pv.forEach((pos, i) => {
    const p = i % 2 ? 3 - player : player;
    drawStone(pos % SIZE, Math.floor(pos / SIZE), p, 0.6);
    ctx.strokeStyle = '#1e88e5';
    ctx.lineWidth = i ? 1.5 : 3;
    circle(pos, CELL * 0.45);
    ctx.stroke();
    label(pos, start + i, p === 1 ? '#fff' : '#111');
  });
}

// The walks of the shown batch, each in its own color, ending in a dot at the leaf it reached.
function drawPaths(paths) {
  paths.forEach((path, k) => {
    ctx.strokeStyle = ctx.fillStyle = `hsla(${k * 360 / paths.length}, 80%, 35%, 0.75)`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    path.forEach((pos, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, center(pos % SIZE), center(Math.floor(pos / SIZE))));
    ctx.stroke();
    circle(path[path.length - 1], CELL * 0.11);
    ctx.fill();
  });
}

const CHART_COLORS = ['#3ddc84', '#4ea1ff', '#ffb74d', '#ef6fa0'];
const CHART_PAD = {left: 56, right: 8, top: 10, bottom: 10};

// The final top moves' visit shares (or win rates) against the number of simulations.
function drawChart() {
  const g = chart.getContext('2d'), w = chart.width, h = chart.height;
  g.clearRect(0, 0, w, h);
  const legend = document.getElementById('legend');
  if (!frames.length) { legend.innerHTML = ''; return; }
  const last = frames[frames.length - 1];
  const top = last.lines.slice(0, 4).map(l => l.pos);
  const value = (f, pos) => chartMode === 'visits' ? f.visits[pos] : f.q[pos] === null ? null : (f.q[pos] + 1) / 2;
  const values = frames.flatMap(f => top.map(pos => value(f, pos))).filter(v => v !== null);
  let lo = chartMode === 'visits' ? 0 : Math.floor(Math.min(...values) * 10) / 10;
  let hi = Math.ceil(Math.max(...values) * 10) / 10;
  if (!(hi > lo)) { lo = Math.max(0, lo - 0.1); hi = lo + 0.2; }
  const x = sims => CHART_PAD.left + (w - CHART_PAD.left - CHART_PAD.right) * sims / last.simulations;
  const y = v => h - CHART_PAD.bottom - (h - CHART_PAD.top - CHART_PAD.bottom) * (v - lo) / (hi - lo);

  g.font = '20px system-ui, sans-serif';
  g.textAlign = 'right';
  g.textBaseline = 'middle';
  g.lineWidth = 1;
  for (const v of [lo, (lo + hi) / 2, hi]) {
    g.strokeStyle = '#3a3e45';
    g.beginPath(); g.moveTo(CHART_PAD.left, y(v)); g.lineTo(w - CHART_PAD.right, y(v)); g.stroke();
    g.fillStyle = '#9a9ea5';
    g.fillText(Math.round(v * 100) + '%', CHART_PAD.left - 8, y(v));
  }
  if (shown >= 0) {
    g.strokeStyle = '#9a9ea5';
    g.setLineDash([4, 4]);
    g.beginPath(); g.moveTo(x(frames[shown].simulations), CHART_PAD.top); g.lineTo(x(frames[shown].simulations), h - CHART_PAD.bottom); g.stroke();
    g.setLineDash([]);
  }
  top.forEach((pos, k) => {
    g.strokeStyle = CHART_COLORS[k];
    g.lineWidth = 3;
    g.beginPath();
    let pen = false;
    for (const f of frames) {
      const v = value(f, pos);
      if (v === null) { pen = false; continue; }
      (pen ? g.lineTo : g.moveTo).call(g, x(f.simulations), y(v));
      pen = true;
    }
    g.stroke();
  });
  legend.innerHTML = top.map((pos, k) => `<span style="color:${CHART_COLORS[k]}">● ${coord(pos)}</span>`).join('');
}

function layer() {
  return game.analysis.visits ? layerSelect.value : 'prior';
}

function drawAnalysis(a, skip) {
  const l = layer();
  if (l === 'q') drawWinRates(a, skip);
  else if (l === 'diff') drawDiff(a, skip);
  else drawProbs(a[l], skip);
}

// The line to show: the hovered candidate's, else the best one's.
function shownLine() {
  const a = game.analysis;
  if (!a || !analysisBox.checked || isOver()) return null;
  const at = focus >= 0 ? focus : hover;
  return a.lines.find(l => l.pos === at) || (pvBox.checked ? a.lines[0] : null) || null;
}

const coord = pos => 'ABCDEFGHIJKLMNOPQRS'[pos % SIZE] + (SIZE - Math.floor(pos / SIZE));
const pct = x => x === null || x === undefined ? '—' : Math.round(x * 100) + '%';
const win = q => q === null || q === undefined ? '—' : Math.round((q + 1) * 50) + '%';

function renderAnalysis(line) {
  const a = game.analysis;
  const live = liveMode();
  const panel = document.getElementById('analysis-panel');
  panel.hidden = !analysisBox.checked || !game.agent || (!a && !live);
  if (panel.hidden) return;
  const replay = document.getElementById('replay');
  replay.hidden = !live;
  pathsBox.disabled = !live;
  liveBox.disabled = !game.watch;
  if (live) {
    frameSlider.max = Math.max(0, frames.length - 1);
    frameSlider.value = Math.max(0, shown);
    frameSlider.disabled = playBtn.disabled = !searchDone || frames.length < 2;
    drawChart();
  }
  const rows = document.getElementById('lines');
  if (!a) {
    document.getElementById('eval-black').textContent = isOver() ? 'Game over' : 'Searching…';
    document.getElementById('eval-white').textContent = '';
    document.getElementById('eval-sims').textContent = '';
    document.getElementById('eval-bar').style.width = '50%';
    rows.innerHTML = '';
    rows.analysis = null;
    return;
  }
  const search = !!a.visits;
  [...layerSelect.options].forEach(o => { o.disabled = !search && o.value !== 'prior'; });
  layerSelect.value = layer();

  // The evaluation bar shows Black's share; `value` is for the player to move.
  const known = a.value !== null && a.value !== undefined;
  const mine = known ? (a.value + 1) / 2 : 0.5;
  const black = game.player === 1 ? mine : 1 - mine;
  document.getElementById('eval-black').textContent = known ? `Black ${Math.round(black * 100)}%` : 'No evaluation';
  document.getElementById('eval-white').textContent = known ? `${Math.round((1 - black) * 100)}% White` : '';
  document.getElementById('eval-sims').textContent = !search ? 'Network only (no search)'
    : live ? `${a.simulations} / ${searchTotal} simulations${thinking ? ' · AI is thinking' : ''}`
    : `${a.simulations} simulations · hover a move for its line`;
  document.getElementById('eval-bar').style.width = black * 100 + '%';

  if (rows.analysis !== a) {  // rebuild only for a new analysis, so hovering a row keeps working
    rows.analysis = a;
    document.getElementById('lines-share').textContent = search ? 'Visits' : '';
    rows.innerHTML = a.lines.slice(0, 6).map(l =>
      `<tr data-pos="${l.pos}"><td>${coord(l.pos)}</td>`
      + `<td title="${search ? l.visits + ' visits' : ''}">${search ? pct(a.visits[l.pos]) : ''}</td>`
      + `<td>${win(l.q)}</td><td>${pct(l.prior)}</td></tr>`).join('');
  }
  for (const tr of rows.rows) tr.classList.toggle('focus', !!line && +tr.dataset.pos === line.pos);
}

function drawProbs(probs, skip = new Set()) {
  const max = Math.max(...probs);
  if (!(max > 0)) return;
  const best = probs.indexOf(max);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `600 ${Math.round(CELL * 0.3)}px system-ui, sans-serif`;
  probs.forEach((p, pos) => {
    if (p < 0.001 || skip.has(pos)) return;
    const t = p / max;
    const cx = center(pos % SIZE), cy = center(Math.floor(pos / SIZE));
    ctx.fillStyle = `rgba(30, 136, 229, ${0.2 + 0.7 * t})`;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * (0.2 + 0.22 * Math.sqrt(t)), 0, Math.PI * 2);
    ctx.fill();
    if (pos === best) {
      ctx.strokeStyle = '#0d47a1';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(cx, cy, CELL * 0.45, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (p >= 0.01) {
      ctx.fillStyle = t > 0.4 ? '#fff' : '#0d2a4a';
      ctx.fillText(Math.round(p * 100), cx, cy + 1);
    }
  });
}

function isOver() {
  return game.done;
}

function canPlay(pos) {
  return pos >= 0 && !thinking && !isOver() && game.state[pos] === 0 && !game.forbidden.includes(pos);
}

function render() {
  drawBoard();
  if (!game) return;
  const {state, moves, player, winner, forbidden} = game;
  const over = isOver();

  moves.forEach((pos, i) => {
    const x = pos % SIZE, y = Math.floor(pos / SIZE);
    const p = state[pos];
    drawStone(x, y, p);
    if (numbersBox.checked) {
      ctx.fillStyle = p === 1 ? '#fff' : '#111';
      ctx.font = `${Math.round(CELL * 0.32)}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(i + 1, center(x), center(y) + 1);
    }
  });

  if (moves.length) {
    const last = moves[moves.length - 1];
    ctx.strokeStyle = '#e53935';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(center(last % SIZE), center(Math.floor(last / SIZE)), CELL * 0.5, 0, Math.PI * 2);
    ctx.stroke();
  }

  const line = shownLine();
  if (!over && analysisBox.checked && game.analysis) {
    drawAnalysis(game.analysis, new Set(line ? line.pv : []));
    if (pathsBox.checked && liveMode() && game.analysis.paths) drawPaths(game.analysis.paths);
    if (line) drawLine(line.pv, player, moves.length + 1);
  }

  if (!over && marksBox.checked) {
    forbidden.forEach(pos => drawForbidden(pos % SIZE, Math.floor(pos / SIZE)));
  }

  if (canPlay(hover) && !(line && line.pos === hover)) {
    drawStone(hover % SIZE, Math.floor(hover / SIZE), player, 0.45);
  }
  canvas.style.cursor = hover >= 0 && !canPlay(hover) ? 'not-allowed' : 'pointer';

  const name = p => p === 1
    ? '<span class="stone b"></span>Black'
    : '<span class="stone w"></span>White';
  const title = game.game === 'connect6' ? 'Connect6' : 'Omok';
  document.title = title;
  document.getElementById('title').textContent = title.toUpperCase();
  const left = game.game === 'connect6' ? ` · ${game.stones_left} to place` : '';
  document.getElementById('player').innerHTML = over ? '—' : name(player) + left;
  document.getElementById('moves').textContent = moves.length;
  document.getElementById('rule').textContent =
    {renju: 'Renju', freestyle: 'Freestyle'}[game.rule] || '6 in a row';
  document.getElementById('message').innerHTML = winner
    ? name(winner) + ' wins!'
    : over ? 'Draw' : '';
  document.getElementById('agent-btn').disabled = !game.agent || over || thinking;
  autoBox.disabled = !game.agent;
  analysisBox.disabled = !game.agent;
  renderAnalysis(line);
  document.getElementById('version').textContent = 'version ' + game.version;
}

function posFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / rect.width * SIZE);
  const y = Math.floor((e.clientY - rect.top) / rect.height * SIZE);
  return x >= 0 && x < SIZE && y >= 0 && y < SIZE ? y * SIZE + x : -1;
}

canvas.addEventListener('mousemove', e => {
  const pos = posFromEvent(e);
  if (pos !== hover) { hover = pos; render(); }
});
canvas.addEventListener('mouseleave', () => { hover = -1; render(); });
canvas.addEventListener('click', async e => {
  const pos = posFromEvent(e);
  if (busy || !game || !canPlay(pos)) return;
  // Render the player's stone first, then ask the AI in a separate request.
  const reply = autoBox.checked && game.agent;
  await send('move', {pos, analysis: analysisBox.checked && !reply && !liveMode()});  // no search before the stone
  if (reply && !game.done) await aiMove();
});

const linesBody = document.getElementById('lines');
linesBody.addEventListener('mouseover', e => {
  const tr = e.target.closest('tr');
  const pos = tr ? +tr.dataset.pos : -1;
  if (pos !== focus) { focus = pos; render(); }
});
linesBody.addEventListener('mouseleave', () => { focus = -1; render(); });

document.querySelectorAll('button[data-action]').forEach(b =>
  b.addEventListener('click', () => b.dataset.action === 'agent' ? aiMove() : send(b.dataset.action)));
numbersBox.addEventListener('change', render);
marksBox.addEventListener('change', render);
// Switch between the live search and a plain analysis of the position.
function analysisChanged() {
  startWatch();
  if (analysisBox.checked && !liveMode()) send('state');
  else render();
}
analysisBox.addEventListener('change', analysisChanged);
liveBox.addEventListener('change', analysisChanged);
pathsBox.addEventListener('change', render);
playBtn.addEventListener('click', play);
frameSlider.addEventListener('input', () => { stopPlay(); showFrame(+frameSlider.value); });
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  chartMode = b.dataset.chart;
  document.querySelectorAll('.seg button').forEach(o => o.classList.toggle('on', o === b));
  render();
}));
chart.addEventListener('click', e => {  // jump to the frame nearest the clicked point
  if (!frames.length || !searchDone) return;
  const rect = chart.getBoundingClientRect();
  const left = CHART_PAD.left / chart.width, right = 1 - CHART_PAD.right / chart.width;
  const t = Math.min(1, Math.max(0, ((e.clientX - rect.left) / rect.width - left) / (right - left)));
  const sims = t * frames[frames.length - 1].simulations;
  let best = 0;
  frames.forEach((f, i) => { if (Math.abs(f.simulations - sims) < Math.abs(frames[best].simulations - sims)) best = i; });
  stopPlay();
  showFrame(best);
});
layerSelect.addEventListener('change', render);
pvBox.addEventListener('change', render);

const keys = {' ': 'reset', a: 'agent', b: 'back', s: 'save'};
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const action = keys[e.key.toLowerCase()];
  if (e.key.toLowerCase() === 'p' && game && game.agent) {
    analysisBox.checked = !analysisBox.checked;
    analysisBox.dispatchEvent(new Event('change'));
    return;
  }
  if (!action) return;
  e.preventDefault();
  if (action === 'agent') return aiMove();
  send(action);
});

send('state');
</script>
</body>
</html>
